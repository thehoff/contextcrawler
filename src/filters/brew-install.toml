[filters.brew-install]
description = "Compact brew install/upgrade output — strip downloads, short-circuit when already installed"
match_command = "^brew\\s+(install|upgrade)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^==> Downloading",
  "^==> Pouring",
  "^Already downloaded:",
  "^###",
  "^==> Fetching",
]
# `unless` keeps real failures from being swallowed. Note: brew prints a benign
# "Warning: <pkg> is already installed" on the success path, so `warning` is
# deliberately excluded — brew signals real failures with "Error:"/"failed".
match_output = [
  { pattern = "already installed", message = "ok (already installed)", unless = "(?i)\\berror[: ]|\\bfailed\\b|\\bfatal\\b|cannot install" },
]
max_lines = 20

[[tests.brew-install]]
name = "already installed short-circuits"
input = """
Warning: contextcrawler 0.27.1 is already installed and up-to-date.
To reinstall 0.27.1, run:
  brew reinstall contextcrawler
"""
expected = "ok (already installed)"

[[tests.brew-install]]
name = "install strips download lines"
input = """
==> Fetching jq
==> Downloading https://homebrew.bintray.com/bottles/jq-1.7.1.arm64_sonoma.bottle.tar.gz
######################################################################## 100.0%
==> Pouring jq-1.7.1.arm64_sonoma.bottle.tar.gz
==> Summary
/opt/homebrew/Cellar/jq/1.7.1: 18 files, 1.2MB
"""
expected = "==> Summary\n/opt/homebrew/Cellar/jq/1.7.1: 18 files, 1.2MB"

[[tests.brew-install]]
name = "failure not swallowed even when already-installed text present"
input = """
Warning: jq 1.7.1 is already installed and up-to-date.
Error: Could not symlink bin/jq
Target /opt/homebrew/bin/jq is a symlink belonging to fd.
"""
expected = """Warning: jq 1.7.1 is already installed and up-to-date.
Error: Could not symlink bin/jq
Target /opt/homebrew/bin/jq is a symlink belonging to fd."""
